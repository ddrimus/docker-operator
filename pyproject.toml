[project]
name = "docker-operator"
version = "1.0.0"
description = "Minimal GitOps-style deployer for docker compose stacks, triggered by Forgejo webhooks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Test-only; requires `git`, `sops`, and `age-keygen` on PATH (tests/e2e/ additionally needs a real Docker daemon, skipped otherwise)
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
docker-operator = "docker_operator.__main__:main"

# Explicit, otherwise setuptools also picks up images/ and refuses to build
[tool.setuptools]
packages = ["docker_operator"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib avoids basename collisions between tests/integration/test_reconcile.py and tests/e2e/test_reconcile.py
addopts = "-ra --import-mode=importlib"
markers = [
    "e2e: exercises real docker/docker compose (see tests/e2e/), select explicitly with -m e2e",
]
