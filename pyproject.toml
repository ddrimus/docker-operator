[project]
name = "docker-operator"
version = "0.1.0"
description = "Minimal GitOps-style deployer for docker compose stacks, triggered by Forgejo webhooks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Test-only; requires `git`, `sops`, and `age-keygen` on PATH
test = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
