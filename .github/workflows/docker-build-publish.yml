name: "Docker: Build & Publish"
# Build on PRs, publish on main, publish and release on version tags, weekly rebuild for base image updates, plus manual dispatch
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# No default permissions, each job sets its own
permissions: {}

# Cancel a superseded PR run, but never a publish
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Image location and platforms, shared by every job
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  lint:
    name: Lint Dockerfile & Release Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Shallow, credential-less checkout; nothing here needs git history or push access
      - name: Checkout repository source code (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Only errors fail the job, unpinned apk/pip packages are intentional
      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # Release tag has to match the version in pyproject.toml
      - name: Verify release tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$project_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version" >&2
            exit 1
          fi

  build:
    name: Build, Smoke Test & Publish Image
    needs:
      - lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      SMOKE_TAG: docker-operator:ci
    steps:
      # Shallow, credential-less checkout; nothing here needs git history or push access
      - name: Checkout repository source code (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Needed to build arm64 on an amd64 runner
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Needed for multi-arch builds, the layer cache and SBOM attestations
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags from the ref (edge on main, semver on tags) plus OCI labels, annotations also go on the multi-arch index
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Docker Operator
            org.opencontainers.image.licenses=Apache-2.0

      # amd64 only, loaded locally so it can be smoke tested before anything is pushed
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # Start the server against an empty stacks repo, wait for /healthz, then check the bundled tools
      - name: Smoke test the running container
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/smoke-repo"
          mkdir -p "$repo/compose"
          touch "$repo/compose/.gitkeep"
          git -C "$repo" init --quiet --initial-branch=main
          git -C "$repo" add -A
          git -C "$repo" -c user.name=ci -c user.email=ci@localhost commit --quiet -m init

          docker run -d --name smoke -p 127.0.0.1:8080:8080 \
            -e GIT_REPO_URL=/repository/stacks \
            -e WEBHOOK_SECRET=smoke-test \
            -v "$repo:/repository/stacks:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$SMOKE_TAG"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec smoke python -m docker_operator --healthcheck
          docker exec smoke sops --version
          docker exec smoke git --version
          docker exec smoke docker compose version

      # Container logs, useful when the smoke test fails
      - name: Show smoke test container logs
        if: always()
        run: docker logs smoke 2>&1 || true

      # Built-in GITHUB_TOKEN, no personal access token needed
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures, pushed only outside of PRs; layers are reused from the smoke test build
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Needed by the signing step below
      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing with this workflow's OIDC identity
      - name: Sign image with cosign
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  release:
    name: Create GitHub Release
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      SBOM_FILE: docker-operator_${{ github.ref_name }}_sbom.cdx.json
    steps:
      # Full history and tags, the release notes need every commit since the previous tag
      - name: Checkout repository source code (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checkout turns an annotated tag into a lightweight one, fetch it again to keep its message
      - name: Fetch annotated release tag
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # CycloneDX SBOM of the published digest, attached to the release
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ env.DIGEST }}
          format: cyclonedx
          output: ${{ env.SBOM_FILE }}

      # Notes from .github/cliff.toml for the tag being built, the token is used to look up PR numbers and GitHub handles
      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: release-notes.md
        with:
          config: .github/cliff.toml
          args: --current --strip all

      # Tags with a suffix like v1.2.0-rc.1 become pre-releases
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$SBOM_FILE" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}"
