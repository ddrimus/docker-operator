services:
  docker-operator:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: docker-operator
    networks:
      - "docker-operator"
    environment:
      TZ: "${TZ}"
      GIT_REPO_URL: "${GIT_REPO_URL}"
      GIT_BRANCH: "${GIT_BRANCH}"
      COMPOSE_SUBDIR: "${COMPOSE_SUBDIR}"
      WEBHOOK_PATH: "${WEBHOOK_PATH}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      SOPS_AGE_KEY_FILE: "${SOPS_AGE_KEY_FILE}"
      REGISTRY_HOST: "${REGISTRY_HOST}"
      REGISTRY_USERNAME: "${REGISTRY_USERNAME}"
      REGISTRY_PASSWORD: "${REGISTRY_PASSWORD}"
      PULL_IMAGES: "${PULL_IMAGES}"
      PRUNE_REMOVED_STACKS: "${PRUNE_REMOVED_STACKS}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS}"
      DEPLOY_TIMEOUT_SECONDS: "${DEPLOY_TIMEOUT_SECONDS}"
      DEPLOY_MAX_RETRIES: "${DEPLOY_MAX_RETRIES}"
      DEPLOY_RETRY_DELAY_SECONDS: "${DEPLOY_RETRY_DELAY_SECONDS}"
      DEPLOY_PRIORITY: "${DEPLOY_PRIORITY}"
      DEPLOY_UID: "${DEPLOY_UID}"
      DEPLOY_GID: "${DEPLOY_GID}"
      NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL}"
      LOG_LEVEL: "${LOG_LEVEL}"
    volumes:
      - "./data/config/sops_age.key:/run/secrets/sops_age.key:ro"
      - "./data/data/data:/data"
      - "./data/data/deploy:/deploy"
      - "./data/data/logs:/logs"
      - "/path/to/forgejo/data/git/repositories/owner/repo.git:/repository/stacks:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped

networks:
  docker-operator:
    name: docker-operator
    driver: bridge